<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn AI by Playing / Aprende IA Jugando</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- 🔝 Controles superiores: HOME + MÚSICA -->
  <div class="top-controls">
    <button id="home-btn"   class="home-btn"   aria-label="Home"         onclick="resetGame()">🏠</button>
    <button id="music-toggle" class="icon-button" aria-label="Toggle music">🔊</button>
  </div>

  <!-- 🚀 Pantalla de bienvenida -->
  <header id="landing">
    <img
      src="images/landing-family-robot.png"
      alt="Family playing an AI game with a little robot"
      class="hero-image"
    />
    <h1>
      Learn AI by Playing 🎉
      <span class="subtitle">¡Aprende IA Jugando 🎉!</span>
    </h1>

    <!-- Selector de idioma -->
    <div id="language-selector">
      <p>Select your language / Selecciona tu idioma:</p>
      <button onclick="setLanguage('en')">English 🇬🇧</button>
      <button onclick="setLanguage('es')">Español 🇪🇸</button>
    </div>
  </header>

  <!-- 🎮 Juego -->
  <main id="game" hidden>
    <div id="question-container"></div>
    <div id="options"></div>
    <div id="feedback" class="chat-bubble"></div>

    <!-- Imagen de reacción -->
    <figure id="baby-reaction">
      <img id="baby-img" src="" alt="" />
    </figure>

    <!-- Controles dentro del juego -->
    <button id="change-lang-btn" aria-label="Change language" onclick="resetGame()">🌐</button>
    <button id="help-btn"   aria-label="Need a hint?" onclick="askAI()">❓Need a hint?</button>
  </main>

  <!-- 🔚 Ancla invisible para forzar scroll hasta el final -->
  <div id="bottom-anchor" style="height:1px;"></div>

  <script src="script.js"></script>
</body>
</html>
